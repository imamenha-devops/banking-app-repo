name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

# Izin ini wajib untuk integrasi OIDC Workload Identity
permissions:
  id-token: write
  contents: read

jobs:
  auth-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step autentikasi tanpa key JSON (Workload Identity Federation)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/21676277660/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-sa@internal-507903.iam.gserviceaccount.com'

      # Verifikasi bahwa autentikasi berhasil
      - name: Verify GCP Auth
        run: |
          gcloud auth list
          gcloud projects describe internal-507903