name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Izin OIDC wajib untuk menghasilkan token pertukaran federasi ke GCP
permissions:
  id-token: write
  contents: read

jobs:
  auth-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/21676277660/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-sa@internal-507903.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP Authentication and Access
        run: |
          echo "=== Verifikasi Token Akses ==="
          gcloud auth print-access-token --quiet > /dev/null && echo "Token OIDC/ADC berhasil digenerate."

          echo "=== Verifikasi Akses Project ==="
          gcloud projects describe internal-507903 --format="table(projectId,projectNumber,name)"